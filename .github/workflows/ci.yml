name: CI

on:
  push:
    branches: [main]
    # A version tag (v1.0.0) also publishes a GitHub Release with the installer (spec 8).
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore SmartHomeRelay.sln

      - name: Build (warnings as errors)
        run: dotnet build SmartHomeRelay.sln --configuration Release --no-restore -warnaserror

      - name: Test (unit + Windows integration)
        run: dotnet test SmartHomeRelay.sln --configuration Release --no-build --filter "Category!=MqttBroker" --blame-hang-timeout 2m --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

      - name: Publish (self-contained win-x64)
        run: dotnet publish src/SmartHomeRelay.App/SmartHomeRelay.App.csproj --configuration Release --runtime win-x64 --self-contained true --output publish

      - name: Upload app
        uses: actions/upload-artifact@v7
        with:
          name: SmartHomeRelay-win-x64
          path: publish

      # The version is defined once, in Directory.Build.props (spec 8).
      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Select-Xml -Path Directory.Build.props -XPath '//Version').Node.InnerText
          "value=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version $version"

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; if ($LASTEXITCODE) { exit $LASTEXITCODE } }
          & $iscc /Qp "/DAppVersion=${{ steps.version.outputs.value }}" "/DSourceDir=..\publish" installer\SmartHomeRelay.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: SmartHomeRelay-installer
          path: installer/output/*.exe
          if-no-files-found: error

  # On a version tag: check it matches Directory.Build.props, then publish a Release with the installer.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, mqtt-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches the version
        run: |
          version=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match version $version in Directory.Build.props." >&2
            exit 1
          fi

      - uses: actions/download-artifact@v5
        with:
          name: SmartHomeRelay-installer
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.exe --title "Smart Home Relay ${GITHUB_REF_NAME#v}" --generate-notes

  # Windows runners cannot run Linux containers, so the real-broker tests run here (spec 9).
  # Core is cross-platform, so its tests run unchanged on Linux.
  mqtt-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install Mosquitto and start the test brokers
        run: |
          sudo apt-get update
          sudo apt-get install -y mosquitto
          bash tests/brokers/start-test-brokers.sh

      - name: Test against a real broker
        env:
          # A missing broker fails the job instead of silently skipping the tests.
          SHR_REQUIRE_MQTT_BROKER: "1"
        run: dotnet test tests/SmartHomeRelay.Core.Tests/SmartHomeRelay.Core.Tests.csproj --configuration Release --filter "Category=MqttBroker" --blame-hang-timeout 2m
